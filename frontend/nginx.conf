server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API so'rovlarini backendga yo'naltirish
    location /api/ {
        proxy_pass https://trendwear-backend.onrender.com/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /docs {
        proxy_pass https://trendwear-backend.onrender.com/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass https://trendwear-backend.onrender.com/openapi.json;
        proxy_set_header Host $host;
    }

    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}