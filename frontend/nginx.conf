# Nginx — frontendni xizmat qiladi va /api so'rovlarini backend nodelar
# orasida taqsimlaydi (Load Balancer roli). Docker Compose'dagi "backend"
# nomi 2+ konteynerga resolve bo'lganda, nginx ularni round-robin qiladi.

upstream backend_cluster {
    # least_conn — eng kam yuklangan nodega yo'naltiradi (auto-scaling uchun foydali)
    least_conn;
    server backend:8000;
    # Docker DNS "backend" nomini barcha replica IP'lariga resolve qiladi.
}

server {
    listen 80;
    server_name _;

    # ---- Statik frontend ----
    root /usr/share/nginx/html;
    index index.html;

    location = /docs {
        proxy_pass http://backend_cluster/api/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://backend_cluster/api/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- API (backend klasterga proxy / load balancing) ----
    location /api/ {
        proxy_pass http://backend_cluster/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ---- Swagger docs (explicit routing for better caching) ----
    location ~ ^/api/(docs|redoc|openapi.json) {
        proxy_pass http://backend_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Salomatlik tekshiruvi ----
    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
