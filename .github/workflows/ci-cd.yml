# =====================================================================
#  CI/CD avtomatlashtirish pipeline'i (BTEC Task 1 talabi)
#  Har push/PR da: kodni tekshiradi → Docker image'larni quradi →
#  (main branchda) serverga deploy qiladi.
# =====================================================================
name: TrendWear CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ---------- 1. BUILD & TEST ----------
  build-and-test:
    name: Build va tekshirish
    runs-on: ubuntu-latest
    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend bog'liqliklarini o'rnatish
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backend importini tekshirish (smoke test)
        working-directory: ./backend
        env:
          DATABASE_URL: "sqlite://"
        run: |
          python -c "import app.schemas, app.models, app.config; print('Backend modullari OK')"

      - name: Docker image'larni qurish
        run: docker compose build

  # ---------- 2. DEPLOY (faqat main) ----------
  deploy:
    name: Serverga deploy
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      # Haqiqiy serverga SSH orqali deploy qilish namunasi.
      # Maxfiy ma'lumotlar GitHub Secrets ichida saqlanadi.
      - name: Serverga ulanib yangilash
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/trendwear
            git pull origin main
            docker compose pull
            docker compose up -d --build
            docker compose ps
