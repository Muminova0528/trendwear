# =====================================================================
#  TrendWear — Render Blueprint (Infrastructure as Code)
#  Render bu faylni avtomatik o'qiydi: bitta web-service (FastAPI + SPA)
#  va bitta boshqariladigan PostgreSQL bazasini yaratadi.
#
#  Eslatma: Render docker-compose'ni ishlatmaydi. Shuning uchun butun
#  ilova (frontend UI + backend API) bitta Docker servisida birlashtirildi,
#  ma'lumotlar bazasi esa Render'ning boshqariladigan Postgres'i sifatida
#  alohida ishlaydi.
# =====================================================================

databases:
  - name: trendwear-db
    databaseName: trendwear_db
    user: trendwear
    plan: free        # bepul reja (90 kun) — kerak bo'lsa "basic-256mb"ga o'zgartiring

services:
  - type: web
    name: trendwear
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trendwear-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true          # Render xavfsiz tasodifiy kalit yaratadi
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
